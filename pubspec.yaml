name: campusvote_flutter
publish_to: "none"
version: 1.0.0+1

description: >
  Cliente móvil Flutter del sistema académico de votación CampusVote.
  Consume la API REST del backend y ofrece el flujo completo de votación.

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado / DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  http_parser: ^4.0.2

  # Foto de perfil (avatar)
  image_picker: ^1.1.2

  # Storage seguro
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Branding dinámico / tipografía
  google_fonts: ^6.2.1

  # Utilidades
  intl: ^0.20.0
  crypto: ^3.0.6
  video_player: ^2.9.2
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Cobertura
  coverage: ^1.10.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/video-campusvote.mp4
    - assets/branding/
    - assets/branding/organizations/

# Ícono de la app (Android/iOS) a partir del logo oficial.
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 18
